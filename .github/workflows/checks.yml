name: checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    # Playwright 1.56 supports Ubuntu 24.04; latest moved to unsupported 26.04.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: pip install -r backend/requirements.txt
      - run: python scripts/check_public_files.py
      - run: ruff check backend scripts
      - run: pytest -q
      - run: npm ci --no-audit --no-fund
        working-directory: frontend
      - run: npm run typecheck
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
      - run: docker compose up -d --build --wait --wait-timeout 240
      - run: python scripts/smoke.py
      - run: npx playwright install chrome
        working-directory: frontend
      - run: npm run test:e2e
        working-directory: frontend
      - if: always()
        run: docker compose logs --tail 80
      - if: always()
        run: docker compose down
