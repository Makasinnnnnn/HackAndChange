name: release
on:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  package:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python scripts/check_public_files.py
      - run: python scripts/package_release.py --output "${{ runner.temp }}/alfa-route-1.0.0.zip"
      - name: Publish version and public archive
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create "$GITHUB_REF_NAME" "${{ runner.temp }}/alfa-route-1.0.0.zip" "${{ runner.temp }}/alfa-route-1.0.0.zip.sha256" --verify-tag --title "Альфа-Маршрут 1.0.0" --notes-file docs/release-1.0.md
